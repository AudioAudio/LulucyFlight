<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efe9f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lulucy's Flight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 보이는 화면 안에 들어가는 가장 큰 9:16 영역에 게임을 꽉 채움(주소창 변화·회전에 자동 대응) */
:root {
  --bg: #efe9f6;
  --line: #d3cbe6;
  --gut: 16px;                      /* 화면 가장자리 여백 */
  --vh: 100dvh;                     /* 실제로 보이는 높이(모바일 주소창 반영) */
  color-scheme: light;
}
@supports not (height: 100dvh) { :root { --vh: 100vh; } }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0; background: var(--bg);
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
  padding-block: var(--gut); box-sizing: border-box; min-height: var(--vh); height: var(--vh);
  display: flex; justify-content: center; align-items: center;
}
.stage {
  /* 폭 제한과 높이 제한 중 작은 쪽에 맞춤 → 항상 화면 안에 꽉 차게 */
  --availW: calc(100vw - 2 * max(var(--gut), env(safe-area-inset-left, 0px)));
  --availH: calc(var(--vh) - 2 * var(--gut) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  width: min(var(--availW), calc(var(--availH) * 9 / 16));
  aspect-ratio: 9 / 16; max-width: 100%;
  position: relative; container-type: inline-size;
}
/* 랭킹 닉네임 입력 창: 캔버스 위에 겹치는 HTML 폼(모바일 키보드 입력용) */
.name-dlg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(60, 48, 104, .46); border-radius: 10px; font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
.name-dlg[hidden] { display: none; }
.name-card { width: 80%; box-sizing: border-box; display: grid; gap: 3cqw; padding: 6cqw 5cqw 4.5cqw; text-align: center; color: #4a4466; background: #fdfaff; border: 1.5px solid #d4b062; border-radius: 4cqw; box-shadow: 0 10px 30px rgba(60, 48, 104, .3); font-size: 15px; font-size: 4.2cqw; }
.name-card h2 { margin: 0; font-family: Cinzel, "Gowun Dodum", serif; font-weight: 700; font-size: 1.45em; color: #6a5ca8; letter-spacing: .02em; }
.name-card p { margin: 0; line-height: 1.55; color: #6b6290; white-space: pre-line; }
.name-card input { width: 100%; box-sizing: border-box; font: inherit; font-size: max(16px, 1.1em); padding: .6em .8em; border: 1.5px solid #cfc5ea; border-radius: 99px; background: #f6f2fd; color: #3b3466; text-align: center; outline: none; }
.name-card input:focus { border-color: #8c82bd; background: #fff; }
.name-card .err { min-height: 1.3em; color: #c0506e; font-size: .9em; }
.name-card .btns { display: flex; gap: 2.5cqw; }
.name-card button { flex: 1; font: inherit; padding: .7em 0; border-radius: 99px; cursor: pointer; border: 1.5px solid #d3cbe6; background: #f3effa; color: #4a4466; }
.name-card button[type=submit] { border-color: #7469ac; background: linear-gradient(#8576c4, #6a5ca8); color: #fff; }
.name-card button:focus-visible, .name-card input:focus-visible { outline: 2px solid #8c82bd; outline-offset: 2px; }
canvas { display: block; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 10px; touch-action: none; cursor: pointer; background: #c9c2ea; box-shadow: 0 10px 30px rgba(120, 105, 170, .18); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
@media (max-width: 600px), (max-height: 600px) {      /* 폰: 여백·테두리 최소화 */
  :root { --gut: 4px; }
  canvas { border: 0; border-radius: 6px; box-shadow: none; }
}
</style>
</head>
<body>

<div class="stage">
  <canvas id="game" aria-label="Lulucy's Flight 게임 화면"></canvas>
  <div class="name-dlg" id="nameDlg" hidden>
    <form class="name-card" id="nameForm" autocomplete="off">
      <h2>Ranking</h2>
      <p id="nameMsg"></p>
      <input id="nameInput" type="text" maxlength="10" enterkeyhint="done" placeholder="닉네임 (최대 10자)" aria-label="닉네임">
      <p class="err" id="nameErr" role="alert"></p>
      <div class="btns"><button type="button" id="nameSkip">건너뛰기</button><button type="submit">등록</button></div>
    </form>
  </div>
</div>

<script>
(() => {
  const W = 360, H = 640, GROUND = 588, PIPE_W = 60;
  // 기본 물리 값은 고정. 이후 난이도 변화는 별도 규칙으로 얹음
  const FIXED = { gravity: 1100, flap: 400, speed: 160 };
  // 난이도 규칙: 최소값은 고정, 최대값만 점수에 따라 시작값에서 최종값으로 직선으로 줄어들고, 기둥마다 [최소, 최대] 안에서 랜덤
  //   gap     = 기둥 세로 간격(위·아래 기둥 사이 통로 높이)
  //   spacing = 기둥 가로 간격(앞 기둥과 다음 기둥의 시작점 사이 거리, 기둥 폭 60 포함)
  const RULES = {
    gap:     { start: { min: 130, max: 300 }, end: { min: 130, max: 150 } },
    spacing: { start: { min: 200, max: 350 }, end: { min: 200, max: 250 } },
  };
  // 초반 완화: 13점까지는 최소값을 더 넓게 고정(최대값은 위 규칙 그대로 줄어듦)
  const EARLY = { untilScore: 13, min: { gap: 200, spacing: 250 } };
  const DEFAULTS = { reachScore: 40, bgmVol: 32, sfxVol: 50 };   // 난이도 최종 도달 점수 40, 사운드 기준 음량(BGM 버스 0.32, 효과음 50%)
  const cfg = { ...FIXED, ...DEFAULTS, hitbox: false, god: false };
  const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
  // 렌더 해상도 고정 720×1280: 게임 좌표(360×640)는 그대로 두고 내부 픽셀만 항상 2배로 그림(기기 화면 밀도와 무관).
  // 아트 리소스가 2배(720×1280) 기준으로 제작되어 1:1로 표시됨. 물리·충돌·난이도 값은 영향 없음
  const DPR = 2;
  cvs.width = W * DPR; cvs.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingQuality = 'high';

  const FONT_D = 'Cinzel, "Times New Roman", serif';
  const FONT_K = '"Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';

  // ---------- 리소스 (상대 경로, 로드 실패 시 각 항목은 도형 렌더러로 폴백) ----------
  const IMG = {};
  function load(key, src) {
    const im = new Image(); IMG[key] = { im, ok: false };
    im.onload = () => IMG[key].ok = true;
    im.onerror = () => console.warn('[LULUSI] 이미지 로드 실패, 도형으로 대체:', src);
    im.src = src;
  }
  [['chars', 'assets/lulusi_atlas.webp'], ['fx', 'assets/fx_atlas.webp'],
   ['tbg', 'assets/title_bg.webp'], ['tlogo', 'assets/title_logo.webp'], ['tchar', 'assets/title_character.webp'],
   ['ttap', 'assets/title_tap_to_start.webp'], ['tset', 'assets/title_settings.webp'], ['tsnd', 'assets/title_sound.webp'],
   ['sky', 'assets/bg_sky.webp'], ['far', 'assets/bg_far.webp'], ['near', 'assets/bg_near.webp'],
   ['mid', 'assets/bg_mid.webp'], ['ground', 'assets/bg_ground.webp'],
   ['pillar_tall', 'assets/pillar_tall.webp'], ['pillar_short', 'assets/pillar_short.webp']].forEach(([k, s]) => load(k, s));
  const ok = (k) => IMG[k].ok, im = (k) => IMG[k].im;
  const AS = 2; // 아트 리소스는 논리 해상도의 2배로 제작
  // 캐릭터 프레임: 0 flap_up 1 flap_mid 2 flap_down 3 glide 4 hit / pivot = 얼굴(양 눈 사이) 고정 기준점
  const CHAR = [{"r": [0, 0, 193, 197], "p": [152, 101]}, {"r": [197, 0, 194, 188], "p": [148, 99]}, {"r": [395, 0, 198, 181], "p": [145, 99]}, {"r": [597, 0, 288, 165], "p": [243, 100]}, {"r": [889, 0, 214, 151], "p": [148, 86]}];
  const FACE_DY = 2;  // 얼굴 기준점과 bird 좌표(히트박스 중심 위 4px)의 오프셋
  // 기둥 조각: capT(아래 기둥의 갭쪽 끝) capB(위 기둥의 갭쪽 끝) med(문장) body(세로 반복)
  const PILLAR = {"tall": {"rects": {"capT": [0, 0, 176, 124], "capB": [0, 128, 176, 161], "med": [0, 293, 176, 140], "body": [0, 437, 176, 106]}, "shaftLeft": 28, "tipOffset": 20}, "short": {"rects": {"capT": [0, 0, 178, 117], "capB": [0, 121, 178, 129], "med": [0, 254, 178, 151], "body": [0, 409, 176, 106]}, "shaftLeft": 29, "tipOffset": 21}};
  const TIP_OUT = 5;  // 캡 장식이 충돌 경계 밖으로 나오는 최대 길이(논리 px). 캡 테두리는 충돌 경계에 맞춰 평평하게 가공됨
  // 타이틀 레이아웃 [x, y, w, h] (논리 px). 원본 완성 이미지(941x1672)에서 각 레이어 위치를 픽셀 매칭으로 찾아 360x640에 그대로 환산
  const TITLE = {"title_logo": [58.9, 16.8, 239.0, 282.0], "character": [101.0, 252.9, 268.0, 280.0], "tap_to_start": [71.9, 506.9, 216.0, 85.5], "settings": [6.9, 560.9, 59.0, 60.5], "sound": [294.2, 559.7, 61.0, 64.0]};
  const BTN_PAD = 4;  // 버튼 터치 영역 여유(설정/사운드는 이미 59x60 이상)
  const FXR = {"feather_a": [0, 0, 56, 46], "feather_b": [60, 0, 52, 52], "feather_c": [116, 0, 47, 28], "sparkles": [167, 0, 105, 101], "crystal_charm": [276, 0, 49, 191], "celestial_emblem": [329, 0, 130, 159], "cloud_cluster": [463, 0, 320, 143]};

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  let best = +store.get('lulusi-best') || 0;

  // ---------- 사운드 (LULUCY'S FLIGHT FINAL AUDIO v1.1) ----------
  // 원본 파일은 편집하지 않고 그대로 사용. 음량은 엔진 게인(NORM: 파일별 음량 맞춤 × MIX: 믹스 비율 × 버스 음량)으로만 조절.
  // 기본은 OGG. Ogg(Vorbis)를 못 여는 브라우저만 같은 패키지의 원본 WAV로 대체.
  const AUD = 'assets/audio/';
  const OGG_OK = (() => { const t = document.createElement('audio'); return !!(t.canPlayType && t.canPlayType('audio/ogg; codecs="vorbis"')); })();
  const BGM_FILES = { title: 'BGM_Title_Loop_20s', ready: 'BGM_Ready_Loop_15s', gameplay: 'BGM_Gameplay_Main_Clean_V3',
    pause: 'BGM_Pause_Loop_10s', results: 'BGM_Results_Loop_10s' };
  const SFX_FILES = { flap: 'SFX_Flap', flap2: 'SFX_Flap_Soft_02', flap3: 'SFX_Flap_Soft_03', score: 'SFX_Score_Point', collision: 'SFX_Collision_Kong',
    fall: 'SFX_Fall_Comic', game_over: 'SFX_Game_Over', new_record: 'SFX_New_Record', medal: 'SFX_Medal', select: 'SFX_Button_Select', back: 'SFX_Button_Back',
    start: 'SFX_Start', pause: 'SFX_Pause', resume: 'SFX_Resume' };
  // 파일별 음량 맞춤 배율(측정값): BGM은 전체 RMS 0.14, SFX는 소리 나는 구간 RMS 0.25 기준, 피크 0.95 이하
  const NORM = {"BGM_Gameplay_Main_Clean_V3": 0.596, "BGM_Pause_Loop_10s": 1.419, "BGM_Ready_Loop_15s": 1.361, "BGM_Results_Loop_10s": 1.311, "BGM_Title_Loop_20s": 1.301, "SFX_Button_Back": 9.75, "SFX_Button_Select": 8.86, "SFX_Collision_Kong": 1.08, "SFX_Fall_Comic": 0.72, "SFX_Flap": 2.88, "SFX_Flap_Soft_01": 2.88, "SFX_Flap_Soft_02": 2.6, "SFX_Flap_Soft_03": 3.33, "SFX_Game_Over": 11.44, "SFX_Medal": 9.57, "SFX_New_Record": 9.04, "SFX_Pause": 11.93, "SFX_Resume": 11.8, "SFX_Score_Point": 9.24, "SFX_Start": 8.46};
  // 믹스: BGM 버스 0.40, 날갯짓 0.176(0.22의 80%), 득점·UI 0.35, 충돌 0.70, 추락 0.55, 징글 0.40
  const MIX = { flap: .176, flap2: .176, flap3: .176, score: .28, select: .35, back: .35, collision: .70, fall: .55, game_over: .40, new_record: .40, medal: .40,
    start: .40, pause: .35, resume: .35 };
  const BGM_XFADE = .2;                                   // 화면 전환 BGM 페이드 0.2초 (지시서 0.12~0.25초)
  const DUCK = .5;                                        // 충돌 순간 BGM 덕킹 −6dB (지시서 −4~−7dB)
  const READY_HOLD = 1.2;                                 // 재시작 대기 화면이 이 시간(초)보다 길어지면 Ready 곡으로 전환
  // 옵션 음량 단계 0~10 (기본 5 = 지금까지의 믹스 음량, 10 = 2배). 0이면 완전히 꺼짐
  const VOL_DEFAULT = 5;
  const readLevel = (key, oldOffKey, oldOffVal) => {
    const v = store.get(key); if (v !== null && v !== '' && !isNaN(+v)) return Math.max(0, Math.min(10, Math.round(+v)));
    return store.get(oldOffKey) === oldOffVal ? 0 : VOL_DEFAULT;                    // 이전 켜짐/꺼짐 설정 이어받기
  };
  const vol = { bgm: readLevel('lulusi-bgm-level', 'lulusi-bgm', '0'), sfx: readLevel('lulusi-sfx-level', 'lulusi-muted', '1'), saved: null };
  const audio = { ac: null, muted: false, sfxBus: null, bgmBus: null, buf: {}, loading: false, lastFlap: -1, flaps: 0, lastFlapVar: '' };
  const bgm = { on: true, started: false, track: null, nodes: null, resume: {}, play: 'gameplay' };   // 플레이 곡은 Main Clean V3 고정
  function audioCtx() {
    if (!audio.ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      try { audio.ac = new AC(); } catch { return null; }
      audio.sfxBus = audio.ac.createGain(); audio.sfxBus.connect(audio.ac.destination);
      audio.bgmBus = audio.ac.createGain(); audio.bgmBus.connect(audio.ac.destination);
      busApply(true);
    }
    if (audio.ac.state === 'suspended' && !document.hidden) audio.ac.resume().catch(() => {});
    return audio.ac;
  }
  function busApply(now) {                                // BGM·SFX 버스 각각 독립 음량과 음소거
    if (!audio.ac) return;
    const t = audio.ac.currentTime, sv = vol.sfx / VOL_DEFAULT * cfg.sfxVol / 100, bv = vol.bgm / VOL_DEFAULT * cfg.bgmVol / 100;
    audio.sfxBus.gain.setTargetAtTime(sv, t, now ? 0 : .05); audio.bgmBus.gain.setTargetAtTime(bv, t, now ? 0 : .12);
  }
  // 미리 받아 두고(대체곡은 선택했을 때만), 오프라인 컨텍스트로 디코딩 → 첫 입력부터 지연 없이 재생
  const fileUrls = (name) => OGG_OK ? [AUD + name + '.ogg', AUD + name + '.wav'] : [AUD + name + '.wav', AUD + name + '.ogg'];
  const prefetch = {};
  const keyName = (key) => { const [kind, id] = key.split(':'); return kind === 'bgm' ? BGM_FILES[id] : SFX_FILES[id]; };
  function fetchFirst(key) { return prefetch[key] || (prefetch[key] = fetch(fileUrls(keyName(key))[0]).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null)); }
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const decoder = OAC ? (() => { try { return new OAC(2, 1, 32000); } catch { return null; } })() : null;
  const decoding = {};
  function decode(key) { return decoding[key] || (decoding[key] = decodeNow(key)); }
  async function decodeNow(key) {
    const ac = decoder || audioCtx(); if (!ac) return null;
    const urls = fileUrls(keyName(key));
    for (let i = 0; i < urls.length; i++) {
      try {
        const data = i === 0 ? await fetchFirst(key) : await fetch(urls[i]).then(r => r.ok ? r.arrayBuffer() : null);
        if (data) { audio.buf[key] = await new Promise((ok, no) => ac.decodeAudioData(data, ok, no)); return audio.buf[key]; }
      } catch (e) { console.warn('[LULUSI] 오디오 디코딩 실패, 다른 형식 시도:', urls[i]); }
    }
    audio.buf[key] = null; console.warn('[LULUSI] 오디오를 불러오지 못함:', key); return null;
  }
  if (decoder) {
    for (const k of Object.keys(SFX_FILES)) decode('sfx:' + k);
    for (const k of Object.keys(BGM_FILES)) decode('bgm:' + k);
  }
  function audioInit() {                                  // 첫 사용자 입력에서 오디오 시작(자동재생 제한 대응)
    if (audio.loading || !audioCtx()) return; audio.loading = true;
    bgm.started = true; bgmSync(true);
  }
  function sfx(name, delay = 0) {                         // 원샷 효과음 (delay: 초 단위 예약)
    const ac = audio.ac; if (!ac || audio.muted) return;
    if (name === 'flap') {                                 // 날갯짓: 75ms 쿨다운, 동시 최대 2개, 변형 3종 중 직전과 다른 것 랜덤
      if (ac.currentTime - audio.lastFlap < .075 || audio.flaps >= 2) return;
      audio.lastFlap = ac.currentTime;
      const vars = ['flap', 'flap2', 'flap3'].filter(v => v !== audio.lastFlapVar && audio.buf['sfx:' + v]);
      if (vars.length) name = vars[Math.floor(Math.random() * vars.length)];
      audio.lastFlapVar = name;
    }
    const b = audio.buf['sfx:' + name];
    if (!b) { if (b === undefined) decode('sfx:' + name); return; }   // 아직 디코딩 전이면 이번 한 번은 생략(대체음 없음)
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = b; g.gain.value = (NORM[SFX_FILES[name]] || 1) * (MIX[name] ?? .35);
    src.connect(g).connect(audio.sfxBus); src.start(ac.currentTime + Math.max(0, delay));
    if (name.startsWith('flap')) { audio.flaps++; src.onended = () => audio.flaps--; }
  }
  // ---------- 충돌 → 추락 → 게임오버 → 결과 순서 (충돌 1회당 정확히 1번씩) ----------
  const death = { active: false, fallAt: 0, goAt: 0, resultsAt: 0 };
  // ---------- BGM: 화면마다 한 곡만, 0.2초 페이드 ----------
  function bgmWanted() {
    const now = audio.ac ? audio.ac.currentTime : 0;
    if (!bgm.on) return null;                                         // 음량 0 = 배경음악 완전히 정지
    if (paused) return 'pause';
    if (state === 'title') return 'title';
    if (state === 'dead') {
      if (!death.goAt || now < death.goAt) return bgm.track;            // 충돌~추락: 플레이 곡을 덕킹한 채 유지

  // ---------- 배경 레이어 (미리 그려두고 스크롤) ----------

  function castles(g, w, base, color, r, scale) {
    g.fillStyle = color;

    while (x < w) {
      const bw = (24 + r() * 40) * scale, bh = (60 + r() * 140) * scale;
      g.fillRect(x, base - bh, bw, bh + 200);
      // 첨탑
      g.beginPath(); g.moveTo(x - 2, base - bh); g.lineTo(x + bw / 2, base - bh - (30 + r() * 50) * scale); g.lineTo(x + bw + 2, base - bh); g.fill();

  // ---------- 장애물: 떠다니는 깃털 기둥 ----------

    const gr = ctx.createLinearGradient(x - s, y - s, x + s, y + s);

    ctx.lineTo(x + s * .22, y + s * .22); ctx.lineTo(x, y + s * 1.5); ctx.lineTo(x - s * .22, y + s * .22);

  }

  // ---------- 게임 상태 ----------
  const bird = { x: 96, y: 300, vy: 0, rot: 0, animT: 1, hw: 30, hh: 26 }; // 히트박스(반폭·반높이 아님, 실제 폭·높이)

  function reset(toTitle) {

  }
  function ruleRange(name, sc) {              // 현재 점수에서 규칙의 [최소, 최대] 범위

  const PILLAR_SHADOW = { color: 'rgba(72,56,119,.15)', blur: 2, dx: 1 };
  function buildPillar(p, top) {
    const P = PILLAR[p.v], R = P.rects, img = im('pillar_' + p.v), sl = P.shaftLeft / AS, PAD = 40;

    const top = py + 92, rowH = 30;
    if (rk.loading && !rk.list) {
      txt('불러오는 중…', W / 2, top + 120, 15, { font: FONT_K, weight: 400, color: '#847da0', stroke: false });
    } else if (rk.err && !rk.list) {
      txt(rk.err, W / 2, top + 90, 15, { font: FONT_K, weight: 400, color: '#847da0', stroke: false });
      pill(RANK.retry, '다시 시도', true, 'rk-retry');
    } else if (rk.list && rk.list.length === 0) {
      txt('아직 기록이 없어요', W / 2, top + 100, 16, { font: FONT_K, weight: 400, color: '#6b6290', stroke: false });
      txt('첫 번째 기록의 주인공이 되어 보세요!', W / 2, top + 128, 13, { font: FONT_K, weight: 400, color: '#9a92b8', stroke: false });
    } else if (rk.list) {
      const MED = ['#d9b04f', '#aaa6c0', '#c8926a'];
      rk.list.forEach((e, i) => {
        const y = top + i * rowH, mine = rk.name && e.name === rk.name;
        if (mine) { ctx.fillStyle = '#f0ebfb'; ctx.beginPath(); ctx.roundRect(px + 14, y - rowH / 2 + 2, pw - 28, rowH - 4, 8); ctx.fill(); }
        if (i < 3) { ctx.fillStyle = MED[i]; ctx.beginPath(); ctx.arc(px + 34, y, 11, 0, Math.PI * 2); ctx.fill(); txt(String(i + 1), px + 34, y + 1, 12, { color: '#ffffff', stroke: false }); }
        else txt(String(i + 1), px + 34, y + 1, 13, { color: '#9a92b8', stroke: false });
        txt(fitText(e.name, 150, 15, FONT_K), px + 56, y + 1, 15, { font: FONT_K, weight: 400, color: mine ? '#4e4190' : '#4a4466', stroke: false, align: 'left' });
        txt(String(e.score), px + pw - 26, y + 1, 17, { color: mine ? '#4e4190' : '#3b3466', stroke: false, align: 'right' });
      });
    }
    ctx.fillStyle = 'rgba(212,176,98,.35)'; ctx.fillRect(px + 30, RANK.name[1] - 10, pw - 60, 1);
    pill(RANK.name, rk.name ? `닉네임: ${fitText(rk.name, 120, 15, FONT_K)}  ·  변경` : '닉네임 정하기', false, 'rk-name');
    txt('닫기', W / 2, RANK.close[1] + 16, 14, { font: FONT_K, weight: 400, color: '#847da0', stroke: false });
    ctx.restore();
  }
  function rankInput(p) {                                   // 랭킹 팝업이 열려 있을 때의 입력
    if (rk.err && !rk.list && !rk.loading && inBox(p, RANK.retry, 4)) { press('rk-retry'); sfx('select'); rankLoad(); return; }
    if (inBox(p, RANK.name, 4)) { press('rk-name'); sfx('select'); askName('change'); return; }
    if (inBox(p, RANK.close, 8) || !inBox(p, RANK.panel)) closeRanking();
  }

  // 고정 타임스텝 루프
  const STEP = 1 / 120; let acc = 0, last = performance.now();
  function loop(now) {
    acc += Math.min(.1, (now - last) / 1000); last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw(); audioTick(); rankTick(); requestAnimationFrame(loop);
  }

  // 입력
  const inBox = (p, b, pad = 0) => p.x >= b[0] - pad && p.x <= b[0] + b[2] + pad && p.y >= b[1] - pad && p.y <= b[1] + b[3] + pad;
  function press(key) { ui.press.key = key; ui.press.t = .14; }
  function startFromTitle() {               // 타이틀 → 플레이. 같은 입력 안에서 한 번만 전환
    if (state !== 'title') return;
    sfx('start'); ui.titleFade = ok('tbg') ? 1 : 0; flap();
  }
  function settingsInput(p) {               // 설정 팝업이 열려 있을 때의 입력(타이틀·플레이 공용)
    for (const kind of ['bgm', 'sfx']) {                     // 음량 행: −/+ 한 칸씩, 막대는 누른 칸까지
      const cy = SET.rows[kind], { minusX, barX, seg, segGap, plusX } = VOLUI;
      if (p.y < cy - 20 || p.y > cy + 20) continue;
      let next = null, key = '';
      if (Math.abs(p.x - minusX) <= 20) { next = vol[kind] - 1; key = kind + '-'; }
      else if (Math.abs(p.x - plusX) <= 20) { next = vol[kind] + 1; key = kind + '+'; }
      else if (p.x >= barX - 4 && p.x <= barX + barW() + 4) next = Math.max(1, Math.min(10, Math.floor((p.x - barX) / (seg + segGap)) + 1));
      if (next === null) continue;
      if (key) press(key);
      setVol(kind, next); sfx('select');                    // 효과음은 바뀐 음량으로 미리 들려줌(0이면 무음)
      return;
    }
    if (inBox(p, SET.close, 6) || !inBox(p, SET.panel)) { ui.settings = false; sfx('back'); }
  }
  // ---------- 플레이 화면 옵션 버튼 ----------
  // 누르면 일시정지 + 설정 팝업. 팝업을 닫으면 일시정지 상태로 남고, 화면을 탭하거나 Space·P를 누르면 이어서 진행
  const SHOW_INGAME_OPTIONS = true;           // false로 바꾸면 플레이 화면의 옵션 버튼이 사라짐
  const OPT_BTN = [8, 8, 36, 37];              // x, y, w, h (논리 px). 터치 영역은 BTN_PAD만큼 넓음
  const optVisible = () => SHOW_INGAME_OPTIONS && (state === 'play' || state === 'ready') && !ui.settings;
  function openIngameOptions() {
    press('opt'); sfx('select');
    if (state === 'play') { paused = true; cancelCountdown(); }
    ui.settings = true; ui.settingsT = 0;
  }
  function drawOptButton() {
    const [x, y, w, h] = OPT_BTN, s = pressScale('opt');
    ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
    if (ok('tset')) ctx.drawImage(im('tset'), -w / 2, -h / 2, w, h);
    else {                                     // 이미지가 없을 때: 단순한 원형 버튼
      ctx.fillStyle = 'rgba(253,250,255,.92)'; ctx.strokeStyle = '#c9a24c'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, w / 2 - 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8c82bd'; for (const dy of [-6, 0, 6]) ctx.fillRect(-8, dy - 1, 16, 2);
    }
    ctx.restore();
  }
  function titleInput(p) {                  // 반환값 true = 입력을 여기서 소비(게임 시작으로 전파하지 않음)
    if (ui.settings) { settingsInput(p); return true; }
    if (!ok('tbg')) return false;
    if (inBox(p, TITLE.settings, BTN_PAD)) { press('settings'); sfx('select'); ui.settings = true; ui.settingsT = 0; return true; }
    if (inBox(p, TITLE.sound, BTN_PAD)) { press('sound'); if (toggleAllSound()) sfx('select'); return true; }
    if (inBox(p, TITLE_RANK, BTN_PAD)) { press('rank'); openRanking(); return true; }
    if (inBox(p, TITLE.tap_to_start)) press('tap');
    return false;                            // 나머지 화면 영역과 Tap to Start = 게임 시작
  }
  cvs.addEventListener('pointerdown', e => {
    e.preventDefault(); audioInit();
    const r = cvs.getBoundingClientRect(), p = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    if (rk.dlg) return;                                                           // 닉네임 입력 중
    if (rk.open) { rankInput(p); return; }                                        // 랭킹 팝업
    if (state === 'title') { if (!titleInput(p)) startFromTitle(); return; }
    if (state === 'dead' && rk.goBtn && inBox(p, rk.goBtn, 4)) { press('gorank'); openRanking(); return; }          // 결과 화면 랭킹 버튼
    if (state === 'dead' && rk.statusBox && rk.status === 'fail' && inBox(p, rk.statusBox)) { sfx('select'); rankSubmit(rk.pendingScore); return; }
    if (ui.settings) { settingsInput(p); return; }                              // 플레이 중 설정 팝업
    if (optVisible() && !(ui.countdown > 0) && inBox(p, OPT_BTN, BTN_PAD)) { openIngameOptions(); return; }   // 카운트다운 중엔 버튼 숨김·무시
    if (paused && state === 'play') { if (ui.countdown <= 0) startCountdown(); return; }   // 일시정지 중 탭 = 3·2·1 후 재개(날갯짓 없이)
    flap();
  });
  addEventListener('keydown', e => {
    audioInit();
    if (rk.dlg || (e.target && e.target.tagName === 'INPUT')) { if (e.code === 'Escape' && rk.dlg) document.getElementById('nameSkip').click(); return; }   // 닉네임 입력 중엔 게임 조작 안 함
    if (rk.open) { if (e.code === 'Escape' || e.code === 'Space') { e.preventDefault(); closeRanking(); } return; }
    if (ui.settings) { if (e.code === 'Escape' || e.code === 'Space') { e.preventDefault(); ui.settings = false; sfx('back'); } return; }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (state === 'title') startFromTitle(); else if (paused && state === 'play') { if (ui.countdown <= 0) startCountdown(); } else flap();
    }
    else if (e.code === 'KeyR') reset(false);
    else if (e.code === 'KeyP' && state === 'play') { if (!paused) paused = true; else if (ui.countdown > 0) cancelCountdown(); else startCountdown(); }
  });

  document.addEventListener('pointerdown', () => audioInit());
  document.addEventListener('keydown', () => audioInit());

  reset(true); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
